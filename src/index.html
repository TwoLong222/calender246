<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Foresight</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <!-- Font đồng bộ với landing page: Bricolage (tiêu đề) · Hanken (nội dung) · IBM Plex Mono (nhãn) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <!-- ================= MÀN HÌNH CHỜ TĨNH =================
       Nằm thẳng trong index.html nên trình duyệt vẽ NGAY khi nhận HTML — trước cả khi
       tải xong main.js. Trước đây màn hình chờ nằm trong calendar-page (Angular), tức
       là chỉ hiện SAU khi app đã dựng xong; khoảng thời gian trước đó là màn trắng trơn.
       Đặt bên trong <app-root>: Angular tự xoá nội dung này lúc bootstrap, không cần
       script gỡ bỏ. LoadingScreenComponent tiếp quản ngay sau đó với % tiến trình THẬT,
       giao diện vẽ giống hệt nên nhìn liền mạch, không thấy chuyển cảnh.
       Màu lấy đúng token của app (xem styles.css): sáng #f9fafb / tối #0f1729. -->
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #0f1729;
      font-family: 'Hanken Grotesk', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #app-splash.is-light { background: #f9fafb; }
    .app-splash-brand { display: flex; flex-direction: column; align-items: center; gap: .75rem; }
    .app-splash-logo { width: 4rem; height: 4rem; animation: app-splash-breathe 2.4s ease-in-out infinite; }
    .app-splash-title { margin: 0; font-size: 1.125rem; font-weight: 600; letter-spacing: -.01em; color: #e2e8f0; }
    #app-splash.is-light .app-splash-title { color: #1f2937; }
    .app-splash-track { width: 13rem; height: .25rem; overflow: hidden; border-radius: 9999px; background: #273244; }
    #app-splash.is-light .app-splash-track { background: #e5e7eb; }
    .app-splash-fill { height: 100%; width: 0; border-radius: 9999px; background: #22407d; animation: app-splash-fill 6s ease-out forwards; }
    #app-splash.is-light .app-splash-fill { background: #2563eb; }
    .app-splash-msg { margin: .75rem 0 0; font-size: .875rem; color: #8a99b3; }
    #app-splash.is-light .app-splash-msg { color: #9ca3af; }
    @keyframes app-splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    /* Chỉ bò tới 35%: Angular tiếp quản với % thật, để cao hơn thì thanh sẽ TỤT ngược. */
    @keyframes app-splash-fill { from { width: 0; } to { width: 35%; } }
    @media (prefers-reduced-motion: reduce) {
      .app-splash-logo, .app-splash-fill { animation: none; }
      .app-splash-fill { width: 20%; }
    }
  </style>
  <script>
    // Đọc theme ĐÃ LƯU ngay tại đây (mặc định 'dark' — khớp ThemeService) để màn hình chờ
    // đúng màu ngay từ khung hình đầu. Đặt luôn class 'dark' lên <html> để khi Angular
    // dựng xong không bị chớp trắng một nhịp rồi mới đổi sang tối.
    (function () {
      try {
        var saved = localStorage.getItem('theme') || 'dark';
        var dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.addEventListener('DOMContentLoaded', function () {
          var el = document.getElementById('app-splash');
          if (el && !dark) el.classList.add('is-light');
        });
      } catch (e) {
        /* localStorage bị chặn -> để nguyên nền tối mặc định */
      }
    })();
  </script>
</head>
<body>
  <app-root>
    <div id="app-splash">

 60 0 61 -153 0 c-198 0 -191 -5 -192 132 l0 103 -63 3 -64 3 4 -130z"/><path d="M2575 1248 c-58 -33 -39 -108 28 -108 57 0 74 84 22 108 -30 14 -25 14 -50 0z"/><path d="M3114 1247 c-3 -8 -4 -34 -2 -58 l3 -44 58 -3 58 -3 -3 58 -3 58 -53 3 c-38 2 -54 -1 -58 -11z"/><path d="M3350 1242 c-43 -35 -23 -102 31 -102 56 0 82 73 37 104 -29 20 -41 20 -68 -2z"/></g>
    </svg>
        <p class="app-splash-title">Foresight</p>
      </div>
      <div class="app-splash-track"><div class="app-splash-fill"></div></div>
      <p class="app-splash-msg">Đang tải sự kiện của bạn...</p>
    </div>
  </app-root>
</body>
</html>
